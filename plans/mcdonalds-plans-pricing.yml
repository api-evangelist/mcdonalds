specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: McDonald's
providerId: mcdonalds
created: '2026-05-04'
modified: '2026-05-05'
reconciled: false
tags:
  - Delivery
  - Fast Food
  - Ordering
  - Restaurants
description: McDonald's does not operate a public developer program. Integrations exist with delivery
  marketplaces (DoorDash, Uber Eats, Grubhub) and crew / ops technology vendors, but those are bilateral
  partnership APIs gated to approved partners and franchisees. There is no published per-API pricing.
  Marketplace economics are dominated by per-order delivery commission paid to the marketplace, not by
  fees charged for API access.
notes: |
  No public developer program. Set reconciled=true only if a public McDonald's developer surface emerges.
  The api.mcdonalds.com domain in the scaffold is illustrative; no public docs resolve there.
sources:
  - https://www.mcdonalds.com/
  - https://corporate.mcdonalds.com/
plans:
  - id: mcdonalds-partner
    name: Approved Partner Integration
    type: enterprise
    description: API integrations with McDonald's are bilateral and limited to approved partners (delivery
      marketplaces, payment processors, loyalty integrators, franchisee technology). Commercial terms
      are negotiated per partnership.
    entries:
      - label: Partner Integration
        description: API access is part of a bilateral partnership; no per-API SKU is sold to general
          developers.
        name: partner_integration
        type: tiered
        metric: varies
        limit: -1
        timeFrame: usage
        geo: global
        unit: 1
        price: 'contact partnerships'
        userMultiplied: false
      - label: Marketplace Commission
        description: For delivery marketplace integrations, per-order economics are settled as commission
          paid to the marketplace (not to McDonald's via API fees).
        name: marketplace_commission
        type: metered
        metric: order
        limit: -1
        timeFrame: usage
        geo: global
        unit: 1
        price: 'per partnership'
        userMultiplied: false
    elements:
      - name: Mobile Order & Pay (Partner)
      - name: Delivery Marketplace Integrations
      - name: Loyalty / MyMcDonald's Integrations
      - name: Restaurant POS Integrations
maintainers:
