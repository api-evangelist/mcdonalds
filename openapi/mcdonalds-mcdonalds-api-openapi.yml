openapi: 3.1.0
info:
  title: McDonald's API
  description: >-
    McDonald's provides partner APIs for ordering, delivery integration, menu data, and restaurant information. These APIs support delivery partners and technology integrations with McDonald's restaurants.
  version: '1.0'
  contact:
    name: McDonald's Developer Support
    url: https://developer.mcdonalds.com/
externalDocs:
  description: Documentation
  url: https://developer.mcdonalds.com/
servers:
  - url: https://api.mcdonalds.com
    description: Production
tags:
  - name: Fast Food
    description: Fast Food operations
security:
  - bearerAuth: []
paths:
  /status:
    get:
      operationId: getStatus
      summary: Get API status
      description: >-
        Returns the current status of the API.
      tags:
        - Fast Food
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  version:
                    type: string
        '401':
          description: Unauthorized
        '429':
          description: Too many requests
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
