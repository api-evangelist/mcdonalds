specification: FinOps Framework
specificationVersion: '1.0'
schema: https://www.finops.org/framework/
alignedWith:
  framework: FinOps Foundation Framework
  frameworkUrl: https://www.finops.org/framework/
  dataSpec: FOCUS
  dataSpecVersion: '1.3'
  dataSpecUrl: https://focus.finops.org/focus-specification/v1-3/
provider: McDonald's
providerId: mcdonalds
publisherName: McDonald's Corporation
serviceCategory: Restaurant / Marketplace Integration
created: '2026-05-04'
modified: '2026-05-05'
reconciled: false
tags:
  - Delivery
  - Fast Food
  - Ordering
  - Restaurants
  - FinOps
  - FOCUS
description: 'FOCUS-aligned FinOps shape for McDonald''s: bilateral partner integrations (delivery
  marketplaces, POS, loyalty). Costs flow through partnership economics (per-order commission, per-store
  technology fees) rather than per-API-call billing.'
notes: |
  No public per-API pricing. Meters represent partnership economic units (orders, stores, marketplace
  commission) rather than API requests.
sources:
  - https://corporate.mcdonalds.com/
principles:
  - name: Visibility
    description: Track per-channel order volume (drive-thru, mobile order, marketplace delivery, kiosk)
      via the McDonald's Global Mobile App and POS analytics; reconcile marketplace orders against
      DoorDash / Uber Eats / Grubhub partner statements.
  - name: Allocation
    description: Allocate by ownership (corporate-owned vs franchisee), market, and channel. For franchisees,
      allocate technology and integration costs to the operating company; for marketplace orders, allocate
      commission to the order's source channel.
  - name: Optimization
    description: Optimize per-order commission via direct-to-consumer (Mobile Order & Pay, MyMcDonald's
      loyalty) where margin is higher than marketplace, negotiate marketplace rates at volume, and
      consolidate POS / kiosk vendor count to reduce per-store technology spend.
  - name: Accountability
    description: Assign owners per channel (mobile, delivery, in-store) who track contribution margin
      and review partnership terms with marketplaces annually.
domains:
  - name: Understand Usage and Cost
    capabilities:
      - Allocation
      - Reporting and Analytics
      - Anomaly Management
  - name: Quantify Business Value
    capabilities:
      - Planning and Estimating
      - Budgeting
      - Unit Economics
  - name: Optimize Usage and Cost
    capabilities:
      - Workload Optimization
      - Licensing and SaaS
  - name: Manage the FinOps Practice
    capabilities:
      - Invoicing and Chargeback
      - Onboarding Workloads
billingModel:
  pricingCategory: Partner Commission + Per-Store Technology Fees
  billingFrequency: Monthly
  billingCurrency: USD (settlement varies by market)
  chargeCategories:
    - Usage
    - Purchase
    - Adjustment
    - Credit
focusColumns:
  ServiceName: McDonald's Partner / Marketplace Integration
  ServiceCategory: Restaurant Marketplace
  ProviderName: McDonald's
  PublisherName: McDonald's Corporation
  InvoiceIssuerName: McDonald's Corporation
  BillingCurrency: USD
  ChargeCategory: Usage
meters:
  - name: orders_processed
    description: Orders processed through a given channel (mobile, drive-thru, kiosk, marketplace).
    unit: order
    aggregation: sum
    dimensions:
      - channel
      - market
      - store
  - name: marketplace_commission
    description: Commission paid to delivery marketplaces per fulfilled order.
    unit: USD
    aggregation: sum
    dimensions:
      - marketplace
      - market
      - store
  - name: stores_active
    description: Active stores integrated with the relevant partner system.
    unit: store-month
    aggregation: avg
    dimensions:
      - market
      - ownership
      - partner
  - name: loyalty_members_active
    description: Active MyMcDonald's loyalty members in the period.
    unit: member-month
    aggregation: avg
    dimensions:
      - market
apis:
  - name: McDonald's API
    baseURL: https://api.mcdonalds.com
    tags:
      - Delivery
      - Fast Food
      - Ordering
      - Restaurants
    serviceName: McDonald's API
    serviceCategory: API
unitEconomics:
  - name: Marketplace Commission per Order
    metric: marketplace_commission / orders_processed
    target: TBD
  - name: Cost per Active Loyalty Member
    metric: program_cost / loyalty_members_active
    target: TBD
maintainers:
  - FN: Kin Lane
    email: kin@apievangelist.com
